title: DSS theme
author: IQSS Data Science Services
version: 0.6.0
quarto-required: ">=1.7.0"
contributes:
  project:
    project:
      type: website
    website:
      favicon: assets/favicon.png
      # Every DSS site sets `repo-url`, so the Report an issue action can live here rather than
      # drifting between them; a consumer without a repo-url simply renders nothing (0.5.0).
      repo-actions: [issue]
      navbar:
        title: false
        pinned: true
        logo:
          light: assets/dss-logo.svg
          dark: assets/dss-logo-dark.svg
        logo-alt: "Data Science Services"
        logo-href: https://www.iq.harvard.edu/data-science-services
        right:
          - text: "Training materials"
            href: https://iqss.github.io/dss-training/
          - text: "Data Science Services"
            href: https://www.iq.harvard.edu/data-science-services
          - text: "Request help"
            href: https://www.iq.harvard.edu/data-science-services/contact-us
      # The footer is provenance, not navigation: the navbar already carries Data Science Services and
      # Request help on every page, and the logo already links to IQSS, so the three right-hand links
      # repeated one or the other (0.6.0). A site puts its licence there instead; it differs per site,
      # so the theme contributes only the left.
      page-footer:
        left: '<a href="https://www.iq.harvard.edu/" class="footer-logo" aria-label="IQSS, the Institute for Quantitative Social Science"></a><span>Data Science Services · Institute for Quantitative Social Science · Harvard University</span>'
    format:
      dss-theme-html: default
  formats:
    html:
      theme:
        light: [cosmo, dss.scss]
        dark: [cosmo, dss.scss, dss-dark.scss]
      respect-user-color-scheme: true
      toc: true
      code-copy: true
      callout-appearance: simple
      link-external-newwindow: true
      grid:
        sidebar-width: 260px
        body-width: 800px
        margin-width: 252px
        gutter-width: 1.5rem
      include-in-header:
        - text: '<meta name="theme-color" content="#3C72B4">'
      include-after-body:
        - dss-switch.html
