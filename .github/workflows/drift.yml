# Re-execute the R and Python pages on a schedule and report what changed underneath them.
#
# Publishing renders from the committed _freeze/, because no runner has R, Python or Stata. That
# keeps publishing fast and deterministic, but it also means the site can go on serving output that
# current packages would no longer produce. This job is the counterweight: once a quarter it
# installs the locked environments, throws the R and Python freezes away, and re-executes every
# chunk.
#
# It commits nothing and opens nothing. Re-rendering rewrites figure PNGs even when nothing
# meaningful changed, so a pull request would be noise every quarter, and the maintainer did not
# want public issues. Instead the job FAILS when there is something to look at, and GitHub emails
# the failure. The two things it fails on:
#
#   1. the render failed        - a package changed in a way the materials do not survive
#   2. a deprecation was raised - the pages set `warning: false`, so these are invisible on the
#                                 site while a learner running the same chunk meets them in their
#                                 own console. This is what would have caught ggplot2's
#                                 size -> linewidth change on its own.
#
# Findings go to both the step log and the run summary. The summary is the readable one, but it
# cannot be fetched from the API, which is how the first failing run left nothing to look at.
#
# It fails only on deprecations it has not been told about. .drift-accepted lists the ones already
# ruled on, each with the decision and its date; without it this job would fail every quarter on
# qplot, which is kept deliberately, and an alarm that always fires gets ignored.
#
# Stata is excluded: it is licensed per machine and cannot run on a hosted runner, so stata/ keeps
# its committed freeze and is checked by hand at the annual bump
# (dss-training-ops/docs/notes/annual-bump.md).

name: Drift check

on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *"   # 06:00 UTC on the first of January, April, July and October
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reexecute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      # Show the warnings the site hides. warning: false sits in each page's YAML
      # front matter, not in _quarto.yml -- the first version of this job edited
      # _quarto.yml and so unhid nothing.
      - name: Unhide warnings and messages
        run: |
          sed -i 's/^  warning: false$/  warning: true/; s/^  message: false$/  message: true/' \
            r/*.qmd python/*.qmd
          grep -c 'warning: true' r/*.qmd python/*.qmd || true

      # Force execution of everything that can run here; Stata keeps its freeze.
      - name: Drop the R and Python freezes
        run: rm -rf _freeze/r _freeze/python

      - name: Re-execute
        id: render
        continue-on-error: true
        run: quarto render 2>&1 | tee render.log

      - name: Report
        run: |
          # Only the render log. The rendered HTML also contains our own prose about
          # deprecations -- the note on the qplot page, for one -- which the first
          # version of this step dutifully reported as a finding.
          grep -hoiE ".{0,80}(is deprecated|was deprecated|deprecated in|superseded|defunct).{0,120}" \
            render.log 2>/dev/null | sed 's/&quot;/"/g' | sort -u > raw.txt || true

          # Quarto's own Node tooling and the runner's package manager emit deprecation
          # warnings of their own, which say nothing about the materials.
          grep -viE "url\.parse|punycode|gdebi|node_modules|npm warn" raw.txt > candidates.txt || true

          # Deprecations already ruled on. .drift-accepted carries one extended regex
          # per line, with the decision and its date in the comments above it.
          cp candidates.txt findings.txt
          accepted=0
          if [ -f .drift-accepted ]; then
            grep -vE '^[[:space:]]*(#|$)' .drift-accepted > accepted.txt || true
            if [ -s accepted.txt ]; then
              grep -cEf accepted.txt candidates.txt > /dev/null 2>&1 && \
                accepted=$(grep -cEf accepted.txt candidates.txt) || accepted=0
              grep -vEf accepted.txt candidates.txt > findings.txt || true
            fi
          fi

          echo "--- findings ---"
          cat findings.txt || true
          echo "--- end findings ($accepted accepted and ignored) ---"

          {
            echo "## Drift check"
            echo
            echo "Render outcome: **${{ steps.render.outcome }}**"
            echo
            if [ -s findings.txt ]; then
              echo "### New deprecations"
              echo
              echo '```'
              head -40 findings.txt
              echo '```'
            else
              echo "No new deprecations."
            fi
            if [ "$accepted" -gt 0 ]; then
              echo
              echo "$accepted known deprecation(s) ignored, per \`.drift-accepted\`."
            fi
            echo
            echo "Publishing is unaffected — the site still renders from the committed freeze."
            echo "To act on this, re-render locally where the languages are installed, commit the"
            echo "freeze, and see dss-training-ops/docs/notes/annual-bump.md."
            if [ "${{ steps.render.outcome }}" = "failure" ]; then
              echo
              echo "<details><summary>Render log, last 60 lines</summary>"
              echo
              echo '```'
              tail -60 render.log
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.render.outcome }}" = "failure" ]; then
            echo "::error::Re-execution failed; see the run summary."
            exit 1
          fi
          if [ -s findings.txt ]; then
            echo "::error::$(wc -l < findings.txt) new deprecation(s); see the run summary."
            exit 1
          fi
          echo "Nothing new to report."
