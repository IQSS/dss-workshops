# Render the site from the committed _freeze/ (no R, Python, or Stata on the runner) and publish it to the
# gh-pages branch; on a version tag, also zip every workshop's materials directory and attach the zips to a
# GitHub release, so https://github.com/IQSS/dss-workshops/releases/latest/download/materials-<lang>-<slug>.zip
# is a stable download link. Each zip unpacks to <lang>-<slug>/, so downloads of two workshops never collide.
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"
      # The R pages come from the committed freeze. The Python pages need Quarto's Jupyter tooling even when
      # nothing executes (the web-scraping page has execution disabled and so no freeze), so install the
      # repository's locked Python environment; _environment points Quarto at it.
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  materials:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Zip each materials directory
        run: |
          mkdir -p dist
          for page in */*.qmd; do
            lang=$(dirname "$page"); slug=$(basename "$page" .qmd)
            [ -d "$lang/$slug" ] || continue
            rm -rf stage && mkdir stage && cp -r "$lang/$slug" "stage/$lang-$slug"
            (cd stage && zip -qr "../dist/materials-$lang-$slug.zip" "$lang-$slug" -x '*.DS_Store' -x '*/.venv/*')
          done
          ls -la dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Materials as of ${GITHUB_REF_NAME}" dist/*.zip \
            || gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
