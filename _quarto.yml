# The DSS workshops: one Quarto website, one page per workshop, grouped by language in the sidebar.
# The look comes from the dss-theme extension (quarto add IQSS/dss-theme); versions from _variables.yml.
project:
  type: dss-theme
  output-dir: _site
  render:
    - index.qmd
    - "r/*.qmd"
  resources:
    - "r/*/*.pdf"

website:
  title: "DSS Workshops"
  site-url: https://iqss.github.io/dss-workshops/
  repo-url: https://github.com/IQSS/dss-workshops-2026
  sidebar:
    style: floating
    search: true
    contents:
      - index.qmd
      - section: "R"
        contents:
          - r/index.qmd
          - r/install.qmd
          - r/intro.qmd

execute:
  freeze: auto
