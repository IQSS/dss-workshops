# The DSS workshops: one Quarto website, one page per workshop, grouped by language in the sidebar.
# The look comes from the dss-theme extension (quarto add IQSS/dss-theme); versions from _variables.yml.
project:
  type: dss-theme
  output-dir: _site
  render:
    - index.qmd
    - "r/*.qmd"
    - "python/*.qmd"
    - "stata/*.qmd"
    - "general/*.qmd"
  resources:
    - "*/*/*.pdf"

website:
  title: "DSS Workshops"
  site-url: https://iqss.github.io/dss-workshops/
  repo-url: https://github.com/IQSS/dss-workshops
  page-navigation: true
  # The theme contributes the footer's left half; the license is this site's own.
  page-footer:
    right:
      - text: "GPL-3.0"
        href: https://github.com/IQSS/dss-workshops/blob/main/LICENSE
  sidebar:
    style: floating
    search: true
    contents:
      - index.qmd
      - general/tools.qmd
      - section: "R"
        contents:
          - r/index.qmd
          - r/install.qmd
          - r/intro.qmd
          - r/models.qmd
          - r/graphics.qmd
          - r/wrangling.qmd
      - section: "Python"
        contents:
          - python/index.qmd
          - python/install.qmd
          - python/intro.qmd
          - python/webscrape.qmd
      - section: "Stata"
        contents:
          - stata/index.qmd
          - stata/install.qmd
          - stata/intro.qmd
          - stata/data.qmd
          - stata/models.qmd
          - stata/graphics.qmd
      - general/resources.qmd

format:
  dss-theme-html:
    include-in-header:
      # Search Console: the meta tag proves ownership of the URL-prefix property; the token is per Google
      # account, the same on every DSS site. Visitor counts: GoatCounter at dss-workshops.goatcounter.com; a page
      # view is recorded with its path, title and referrer, no cookie, nothing that identifies the reader.
      # Adding #toggle-goatcounter to any iqss.github.io address switches counting off in that browser.
      - text: |
          <meta name="google-site-verification" content="yQHSXWQVwOPIg4wRh9A8zusoTpcfgW05SWdbVN0rF-s">
          <script data-goatcounter="https://dss-workshops.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

execute:
  freeze: true
