# The DSS workshops: one Quarto website, one page per workshop, grouped by language in the sidebar.
# The look comes from the dss-theme extension (quarto add IQSS/dss-theme); versions from _variables.yml.
project:
  type: dss-theme
  output-dir: _site
  render:
    - index.qmd
    - "r/*.qmd"
    - "python/*.qmd"
    - "stata/*.qmd"
    - "general/*.qmd"
  resources:
    - "*/*/*.pdf"

website:
  title: "DSS Workshops"
  site-url: https://iqss.github.io/dss-workshops-2026/   # the working address; iqss.github.io/dss-workshops/ after the rename swap
  repo-url: https://github.com/IQSS/dss-workshops-2026
  sidebar:
    style: floating
    search: true
    contents:
      - index.qmd
      - section: "R"
        contents:
          - r/index.qmd
          - r/install.qmd
          - r/intro.qmd
          - r/models.qmd
          - r/graphics.qmd
          - r/wrangling.qmd
      - section: "Python"
        contents:
          - python/index.qmd
          - python/install.qmd
          - python/intro.qmd
      - section: "Stata"
        contents:
          - stata/index.qmd
          - stata/install.qmd
          - stata/intro.qmd
      - section: "Any language"
        contents:
          - general/tools.qmd

execute:
  freeze: auto
